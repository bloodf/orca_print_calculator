name: Publish to Orca Cloud

# Publishing a GitHub release publishes that version to Orca Cloud (and attaches the wheel to the release).
#
# Flow: bump pyproject.toml and CHANGELOG.md on main, push the tag vX.Y.Z at that commit, then publish a
# GitHub release for the tag (gh release create vX.Y.Z --verify-tag ...). That event runs this workflow.
# docs/release.md has the exact steps and what to verify afterwards.
#
# One-time setup: connect this repository on Orca Cloud (Edit plugin > GitHub publishing).
# No secrets: the run proves its origin with a short-lived GitHub OIDC token (audience orcacloud).
# Orca Cloud only accepts runs triggered by a published release, so pushing a tag or running this by hand
# (workflow_dispatch) does nothing useful. Re-running a run that already published is safe.

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: write # gh release upload (the wheel and SHA256SUMS)

env:
  TAG: ${{ github.event.release.tag_name }}
  GH_TOKEN: ${{ github.token }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Tag must look like v1.2.3
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::release tag '$TAG' must be vX.Y.Z (Orca Cloud takes numeric X.Y.Z versions)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.18.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Tag must equal pyproject version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match pyproject version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      # The same checks as CI, so a tag on an unchecked commit cannot ship.
      - run: pnpm -C ui install --frozen-lockfile
      - name: Shared Orca UI snapshot is unmodified (Vue + PrimeVue preset, palette)
        run: node ui/shared/scripts/check.mjs
      - run: pnpm -C ui lint
      - run: pnpm -C ui typecheck
      - run: pnpm -C ui test:coverage
      - name: Contract fixtures are up to date
        run: python3 scripts/gen_contract.py --check
      - name: Build (build.py re-checks tag == version)
        run: python3 scripts/build.py --release-tag "$TAG"
      - name: Bundle size gate
        run: |
          size="$(wc -c < ui/dist/index.html)"
          echo "ui/dist/index.html: $size bytes (limit 960000)"
          [ "$size" -le 960000 ] || { echo "::error::ui/dist/index.html is $size bytes, over 960000"; exit 1; }
      - name: Unit tests
        run: python -m unittest discover tests
      - name: Built wheel matches SHA256SUMS and carries the version
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          unzip -p dist/orca_print_calculator_any.whl "orca_print_calculator-$VERSION.dist-info/METADATA" | grep -Fx "Version: $VERSION"
          unzip -p dist/orca_print_calculator_any.whl orca_print_calculator/__init__.py | grep -F "VERSION = '$VERSION'"
          cat dist/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - name: Changelog section for this version
        run: |
          release_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
          python3 scripts/release_notes.py "$VERSION" --limit 0 > notes-full.md
          python3 scripts/release_notes.py "$VERSION" --url "$release_url" > notes.md
      - name: Attach the wheel and checksums, fill empty release notes
        run: |
          gh release upload "$TAG" dist/orca_print_calculator_any.whl dist/SHA256SUMS --clobber
          if [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then
            gh release edit "$TAG" --notes-file notes-full.md
          fi
      - name: Publish to Orca Cloud
        run: |
          set -euo pipefail
          oidc_token="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=orcacloud" | jq -r .value)"
          if [ -z "$oidc_token" ] || [ "$oidc_token" = "null" ]; then
            echo "::error::no OIDC token (the job needs permissions: id-token: write)"
            exit 1
          fi
          echo "::add-mask::$oidc_token"
          metadata="$(jq -cn --arg version "$VERSION" --rawfile changelog notes.md \
            '{version: $version, changelog: $changelog}')"
          status="$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            --form-string "metadata=$metadata" -F "files=@dist/orca_print_calculator_any.whl" \
            https://api.orcaslicer.com/api/v1/plugin-publish/releases)"
          cat response.json; echo
          if [ "$status" != "201" ]; then
            echo "::error::Orca Cloud returned HTTP $status (401: repository not connected to exactly one plugin, or the run was not triggered by a published release; version error: tag not higher than the current plugin version)"
            exit 1
          fi
          echo "Published $TAG to Orca Cloud." >> "$GITHUB_STEP_SUMMARY"
