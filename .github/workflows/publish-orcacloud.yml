name: Publish to Orca Cloud

# Manual only. Run it from a tag whose name equals the version in pyproject.toml (v0.1.0 or 0.1.0).
# One-time setup: connect this repository on Orca Cloud (Edit plugin > GitHub publishing).
# No secrets: the run proves its origin with a short-lived GitHub OIDC token.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Require a tag ref
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::Run this workflow from a tag, not $REF_TYPE '$REF_NAME'"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.18.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tag must equal pyproject version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::tag $TAG does not match pyproject version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      # The same checks as CI, so a tag on an unchecked commit cannot ship.
      - run: pnpm -C ui install --frozen-lockfile
      - run: pnpm -C ui lint
      - run: pnpm -C ui typecheck
      - run: pnpm -C ui test:coverage
      - name: Contract fixtures are up to date
        run: python3 scripts/gen_contract.py --check
      - name: Build (build.py re-checks tag == version)
        run: python3 scripts/build.py --release-tag "$TAG"
        env:
          TAG: ${{ github.ref_name }}
      - name: Bundle size gate
        run: |
          size="$(wc -c < ui/dist/index.html)"
          echo "ui/dist/index.html: $size bytes (limit 350000)"
          [ "$size" -le 350000 ] || { echo "::error::ui/dist/index.html is $size bytes, over 350000"; exit 1; }
      - name: Unit tests
        run: python -m unittest discover tests
      - name: Publish to Orca Cloud
        run: |
          set -euo pipefail
          oidc_token="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=orcacloud" | jq -r .value)"
          metadata="$(jq -cn --arg version "$VERSION" --arg changelog "Release $VERSION" \
            '{version: $version, changelog: $changelog}')"
          status="$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            --form-string "metadata=$metadata" -F "files=@dist/orca_print_calculator_any.whl" \
            https://api.orcaslicer.com/api/v1/plugin-publish/releases)"
          cat response.json; echo
          if [ "$status" != "201" ]; then
            echo "::error::Orca Cloud returned HTTP $status"
            exit 1
          fi
